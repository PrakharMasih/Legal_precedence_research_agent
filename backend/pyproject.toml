# Coverage baseline: 91% total line coverage from `pytest --cov=src --cov-report=term-missing` on 2026-04-23.
[project]
name = "Casey-legal-precedent-agent"
version = "0.1.0"
description = "Legal precedent research agent for Indian court judgments"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0,<6.0",
    "aiosqlite>=0.20,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "qdrant-client[async]>=1.9,<2.0",
    "fastapi>=0.111,<0.112",
    "httpx>=0.27,<0.28",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langchain-text-splitters>=0.3,<0.4",
    "openai>=1.30,<2.0",
    "numpy>=1.26,<2.0",
    "pdfplumber>=0.11,<0.12",
    "pydantic-settings>=2.3,<3.0",
    "pydantic>=2.7,<3.0",
    "sentence-transformers>=3.0,<4.0",
    "spacy>=3.7,<3.8",
    "structlog>=24.1,<25.0",
    "uvicorn[standard]>=0.30,<0.31",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=7.1,<8.0",
    "ruff>=0.5,<0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
